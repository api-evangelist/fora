name: Fora
description: 'Fora is a modern, tech-enabled host travel agency headquartered in New York City,
  founded in 2021 by Henley Vazquez, Evan Frank and Jake Peters. It equips independent travel
  advisors with a custom booking portal, 700+ training videos, live support, preferred supplier
  partnerships, an IATA number, E&O insurance and automated commission collection, powered by a
  Travelport-backed booking platform and integrations such as Tablet Hotels. Fora runs a consumer
  traveler app plus an advisor portal and is building agentic AI tooling (Via / Sidekick) to
  streamline advisor workflows. Backed by Forerunner Ventures and Insight Partners, Fora does not
  currently publish a public developer API; this profile tracks its identity and web properties
  within the API Evangelist network.'
